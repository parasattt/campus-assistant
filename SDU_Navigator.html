<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SDU Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: icon rail | working panel | campus map (desktop) — bottom tab bar + full-screen views (phone).
   Signature: "the spine" — the one corridor C→H drawn as a metro line, stations coloured like the official SDU map. */
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --sunk:#ECEAE3; --ink:#14213D; --ink-2:#4B5570; --ink-3:#7D8499;
  --line:#DEDBD2; --accent:#17807E; --accent-ink:#FFFFFF; --accent-soft:#DCEFEE; --warn:#9A6A12; --warn-soft:#F6ECD6;
  --mapbg:#EEEDE7; --floor:#D9D8D3; --floor-edge:#C9C8C2; --bldg:#B9B7B0; --maptext:#14213D; --route:#E0562B;
  --bA:#C2685B; --bB:#C9B079; --bC:#7FAE95; --bD:#7E3584; --bE:#6E1C22; --bF:#383E80; --bG:#5D7A39; --bH:#36689F; --bI:#8A8F9E;
  --canteen:#5FC4BF; --canteen-2:#A8DEDA; --barrel:#D8AE57; --pink:#D7A2C8; --lib:#13808A;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sign:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141F; --surface:#171D2B; --sunk:#1E2535; --ink:#ECEEF3; --ink-2:#B3B9C8; --ink-3:#848B9D;
  --line:#2A3245; --accent:#4CC2BD; --accent-ink:#0B1A1A; --accent-soft:#163236; --warn:#E6B65A; --warn-soft:#2E2715;
  --mapbg:#0D111A; --floor:#2A3142; --floor-edge:#364055; --bldg:#4A5266; --maptext:#ECEEF3; --route:#FF7A4D;
  --bA:#D97D6F; --bB:#CDB685; --bC:#86BCA0; --bD:#B262B8; --bE:#B8494F; --bF:#6F78D6; --bG:#87AA5A; --bH:#5D95D3; --bI:#8A8F9E;
  --canteen:#3E9C98; --canteen-2:#2B5E5C; --barrel:#C99B45; --pink:#B57CA6; --lib:#2AA5AF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141F; --surface:#171D2B; --sunk:#1E2535; --ink:#ECEEF3; --ink-2:#B3B9C8; --ink-3:#848B9D;
  --line:#2A3245; --accent:#4CC2BD; --accent-ink:#0B1A1A; --accent-soft:#163236; --warn:#E6B65A; --warn-soft:#2E2715;
  --mapbg:#0D111A; --floor:#2A3142; --floor-edge:#364055; --bldg:#4A5266; --maptext:#ECEEF3; --route:#FF7A4D;
  --bA:#D97D6F; --bB:#CDB685; --bC:#86BCA0; --bD:#B262B8; --bE:#B8494F; --bF:#6F78D6; --bG:#87AA5A; --bH:#5D95D3; --bI:#8A8F9E;
  --canteen:#3E9C98; --canteen-2:#2B5E5C; --barrel:#C99B45; --pink:#B57CA6; --lib:#2AA5AF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.ico{width:20px;height:20px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;display:grid;grid-template-columns:76px minmax(0,410px) minmax(0,1fr)}
/* rail */
#rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:14px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
.mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-bottom:14px}
.mark svg{width:26px;height:26px}
.tab{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:12px;color:var(--ink-2);font-size:11.5px;font-weight:600}
.tab .ico{width:22px;height:22px}
.tab:hover{background:var(--sunk)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* panel */
#panel{overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 20px 10px;background:var(--bg)}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{padding:5px 8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--sunk)}
.view{padding:4px 20px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.view[hidden]{display:none!important}
h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 0;font-weight:800;text-wrap:balance}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:700}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}

/* search box */
.search{position:relative;z-index:4}
.search > .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 46px 0 46px;font-size:16px;font-weight:500;box-shadow:var(--shadow)}
.search input::-webkit-search-cancel-button,.small-input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.search .x:hover{background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;min-height:38px}
.chip .ico{width:16px;height:16px;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .ico{color:inherit}

/* results */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res-head{display:flex;align-items:center}
.res-row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;text-align:left;min-height:58px}
.res-row:hover{background:var(--sunk)}
.fav-btn{flex:none;width:44px;height:44px;margin-right:4px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.fav-btn:hover{background:var(--sunk);color:var(--accent)}
.fav-btn .ico{fill:none}
.fav-btn[aria-pressed="true"]{color:var(--accent)}
.fav-btn[aria-pressed="true"] .ico{fill:currentColor}
.tile{flex:none;min-width:52px;height:38px;padding:0 8px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--sign);font-weight:700;font-size:19px;letter-spacing:.02em}
.tile .ico{width:20px;height:20px}
.res-main{flex:1;min-width:0}
.res-main b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-main small{color:var(--ink-2);font-size:13px}
.chev{color:var(--ink-3);transition:transform .2s}
.res-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.res-card{padding:2px 14px 14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.empty b{font-size:16px}
.count{font-size:13px;color:var(--ink-3);font-weight:600}

/* place card */
.pc{display:flex;flex-direction:column;gap:12px}
.dec{display:flex;align-items:stretch;gap:6px}
.dec div{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:6px 10px 5px;border-radius:10px;background:var(--sunk)}
.dec div:first-child{background:var(--c);color:#fff}
.dec span{font-family:var(--sign);font-weight:700;font-size:30px;line-height:1}
.dec small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.8;margin-top:3px}
.dec .eq{background:none;min-width:0;padding:0 2px;color:var(--ink-3);font-size:20px}
.decline{font-size:14px;color:var(--ink-2)}
.decline b{color:var(--ink)}
.meta{display:flex;flex-direction:column;gap:3px;font-size:14px}
.meta .fac{color:var(--ink-2)}
.alias{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.alias b{font-family:var(--sign);font-size:16px;color:var(--ink);background:var(--sunk);padding:1px 7px;border-radius:6px}
.note{display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:8px 10px;line-height:1.4}
.note .ico{width:16px;height:16px;margin-top:1px;color:var(--ink-3)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.warn .ico{color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn .ico{width:18px;height:18px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}

/* cards on home */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.next{display:flex;gap:14px;align-items:center}
.next .tile{height:auto;align-self:stretch;min-width:64px;font-size:22px}
.next-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.next-main b{font-size:15.5px}
.next-main small{color:var(--ink-2);font-size:13px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px;align-self:flex-start}

/* metro / spine */
.metro{list-style:none;margin:0;padding:0}
.metro li{position:relative;padding-left:40px}
.metro li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:5px;background:var(--c)}
.metro li:first-child::before{top:50%}
.metro li:last-child::before{bottom:50%}
.metro li.solo::before{display:none}
.metro .dot{position:absolute;left:7px;top:50%;width:21px;height:21px;margin-top:-10.5px;border-radius:50%;background:var(--surface);border:5px solid var(--c);z-index:1}
.metro li.end .dot{background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.metro li.off::before{background:repeating-linear-gradient(to bottom,var(--c) 0 5px,transparent 5px 9px)}
.metro li.off .dot{border-style:dashed}
.metro li.branch{margin-left:22px}
.metro li.branch::before{left:15px}
.st{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px 8px 4px;border-radius:10px;text-align:left;min-height:50px}
button.st:hover{background:var(--sunk)}
.st .L{font-family:var(--sign);font-weight:700;font-size:24px;line-height:1;width:20px;color:var(--c);flex:none;text-align:center}
.st .T{flex:1;min-width:0;display:flex;flex-direction:column}
.st .T b{font-size:14px;font-weight:700}
.st .T small{font-size:12.5px;color:var(--ink-2)}
.metro li.pass .st{min-height:38px;padding-block:4px}
.metro li.pass .T b{font-weight:600;color:var(--ink-2)}
.metro li.stair .dot{border-radius:5px;width:19px;height:19px;margin-top:-9.5px;left:8px;border-width:4px}

/* places */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-inline:20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.small-input{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%;font-size:16px}
.small-input:focus{outline:none;border-color:var(--accent)}
.grouph{margin-top:6px}

/* route */
.back{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--ink-2);padding:6px 8px 6px 2px;border-radius:8px}
.back:hover{color:var(--ink)}
.rform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 8px;align-items:center}
.rfield{position:relative}
.rfield.from{grid-column:1;grid-row:1}.rfield.to{grid-column:1;grid-row:2}
.rfield label{position:absolute;left:14px;top:7px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rfield input{width:100%;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:18px 14px 0 34px;font-weight:600;font-size:16px}
.rfield input:focus{outline:none;border-color:var(--accent)}
.rfield i{position:absolute;left:14px;top:32px;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink)}
.rfield.to i{background:var(--route);border-color:var(--route)}
.swap{grid-row:1/3;grid-column:2;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:10;max-height:280px;overflow:auto;padding:4px}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;padding:8px;border-radius:8px;text-align:left}
.sugg button:hover,.sugg button.on{background:var(--sunk)}
.sugg .tile{min-width:44px;height:30px;font-size:16px}
.sugg small{color:var(--ink-2);font-size:12px;display:block}
.search-sugg{max-height:min(320px,45vh)}
.search-sugg [role="option"]{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;text-align:left}
.search-sugg [role="option"]:hover,.search-sugg [role="option"][aria-selected="true"]{background:var(--sunk)}
.search-sugg .sugg-empty{padding:12px;color:var(--ink-2);font-size:13px}
.search-sugg mark{background:var(--accent-soft);color:var(--ink);border-radius:3px}
.summary{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-family:var(--sign);font-weight:700;font-size:18px}
.summary span{display:inline-flex;align-items:center;gap:4px}
.summary i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c)}
.summary em{font-style:normal;color:var(--ink-3);font-weight:500}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:14.5px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink-2)}
.speech-controls{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.speech-controls .btn{min-height:44px}
.speech-controls .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.speech-status{font-size:12.5px;color:var(--ink-2)}
.speech-status[data-error="true"]{color:var(--warn)}

/* ask */
#v-ask{min-height:100%}
.thread{display:flex;flex-direction:column;gap:12px;flex:1}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;display:flex;flex-direction:column;gap:10px;width:92%}
.mini{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--sunk)}
.mini .res-main small{font-size:12.5px}
.mini .acts{flex-wrap:nowrap;gap:4px}
.mini .btn.sm{padding:0 9px}
.askbar{position:sticky;bottom:0;background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.askform{display:flex;gap:8px}
.askform input{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.askform input:focus{outline:none;border-color:var(--accent)}
.askform .btn{min-height:50px}

/* map */
#mapwrap{position:relative;overflow:hidden;background:var(--mapbg);min-width:0;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.band{opacity:.13}
.floorpoly{fill:var(--floor);stroke:var(--floor-edge);stroke-width:1}
.blk{cursor:pointer}
.blk .bk{fill:var(--c);stroke:var(--mapbg);stroke-width:1.2;transition:opacity .2s}
.blk .soft{opacity:.45}
.blk:hover .bk{filter:brightness(1.08)}
.blk.sel .bk{stroke:var(--ink);stroke-width:2.2}
.dim .blk:not(.sel) .bk{opacity:.35}
.dim .blk:not(.sel) .soft{opacity:.2}
.blk:focus-visible{outline:none}
.blk:focus-visible .bk{stroke:var(--accent);stroke-width:3}
.cell{fill:none;stroke:var(--mapbg);stroke-width:1;opacity:.55;pointer-events:none}
.badge circle{fill:var(--c)}
.badge text{fill:#fff;font-family:var(--sign);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central}
.lbl{fill:var(--maptext);font-family:var(--sign);text-anchor:end}
.lbl .big{font-weight:700;font-size:17px}
.lbl .small{font-weight:500;font-size:10.5px;fill:var(--ink-2)}
.barrel{fill:var(--barrel);stroke:var(--mapbg);stroke-width:1.5;cursor:pointer}
.barrel-t{fill:#3B2A07;font-family:var(--sign);font-weight:700;font-size:15px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.poi{cursor:pointer}
.poi circle{stroke:var(--mapbg);stroke-width:1.5}
.poi:hover circle{filter:brightness(1.1)}
.wc{fill:var(--ink-3);font-family:var(--sign);font-size:7.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.floor2 .poi,.floor2 .wc{opacity:.25;pointer-events:none}
.route-line{fill:none;stroke:var(--route);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.route-casing{fill:none;stroke:var(--surface);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-off{stroke-dasharray:3 9}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{fill:var(--route);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.draw{animation:none;stroke-dashoffset:0}.pulse{animation:none}.chev{transition:none}}

.mapctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mapctl button{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.floors{position:absolute;left:14px;top:14px;z-index:4;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.floors .seg{box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line)}
.floors .seg button{padding:7px 11px;font-family:var(--sign);font-size:15px}
.floors .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapnote{max-width:260px;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--ink-2);box-shadow:var(--shadow)}

/* sheet */
.sheet{position:absolute;left:16px;bottom:16px;width:min(380px,calc(100% - 32px));max-height:calc(100% - 90px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:6;overflow:hidden}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 4px 16px}
.grab{display:none}
.sheet-h .ttl{flex:1;min-width:0}
.sheet-h .ttl b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sheet-h .ttl small{color:var(--ink-2);font-size:13px}
.sheet-b{padding:8px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.roomlist{display:flex;flex-wrap:wrap;gap:6px}
.roomlist button{font-family:var(--sign);font-weight:700;font-size:15px;padding:5px 9px;border-radius:8px;background:var(--sunk);min-height:34px}
.roomlist button:hover{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.fl{display:flex;flex-direction:column;gap:6px}
.fl button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:10px}
.fl button:hover{background:var(--sunk)}
.fl .tile{min-width:34px;height:30px}
.fl .tile .ico{width:16px;height:16px}
.foot{font-size:12px;color:var(--ink-3);line-height:1.5}

/* phone */
@media (max-width: 899px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #rail{grid-row:2;grid-column:1;flex-direction:row;justify-content:space-around;padding:6px 6px;border-right:0;border-top:1px solid var(--line)}
  .mark{display:none}
  .tab{flex:1;max-width:96px}
  #panel,#mapwrap{grid-row:1;grid-column:1;border-right:0}
  body[data-tab="map"] #panel{display:none}
  body:not([data-tab="map"]) #mapwrap{display:none}
  .view{padding-inline:16px}
  .topbar{padding-inline:16px}
  .filters{margin:0 -16px;padding-inline:16px}
  .sheet{left:0;right:0;bottom:0;width:100%;border-radius:20px 20px 0 0;max-height:72%;border-bottom:0;transition:transform .25s ease}
  .sheet.collapsed{transform:translateY(calc(100% - 92px))}
  .grab{display:grid;place-items:center;width:72px;height:28px;margin:0 auto;flex:none}
  .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
  .grabzone{touch-action:none;cursor:grab}
  .mapctl{top:auto;bottom:16px}
  .has-sheet .mapctl{display:none}
  h1{font-size:25px}
}
@media (max-width:360px){.tab{font-size:10px}}

/* =============================================
   SDU NAVIGATOR / MOTION LAYER
   Purposeful map-first transitions; no external JS.
   ============================================= */
:root { --motion-snappy: 180ms; --motion-fluid: 360ms; --motion-ease: cubic-bezier(.22,1,.36,1); }

@keyframes sduFadeRise {
  from { opacity:0; transform:translate3d(0,12px,0); }
  to   { opacity:1; transform:translate3d(0,0,0); }
}
@keyframes sduSoftReveal {
  from { opacity:0; filter:blur(5px); }
  to   { opacity:1; filter:blur(0); }
}
@keyframes sduMapBlock {
  from { opacity:0; transform:translate3d(0,8px,0); }
  to   { opacity:1; transform:translate3d(0,0,0); }
}
@keyframes sduStationIn {
  from { opacity:0; transform:scale(.3); }
  65% { opacity:1; transform:scale(1.15); }
  to   { opacity:1; transform:scale(1); }
}
@keyframes sduCorridorTrace {
  0% { opacity:0; stroke-dashoffset:1150; }
  10% { opacity:.75; }
  75% { opacity:.82; stroke-dashoffset:0; }
  100% { opacity:0; stroke-dashoffset:0; }
}
@keyframes sduFlow {
  to { stroke-dashoffset:-40; }
}
@keyframes sduRouteGlow {
  0%, 100% { opacity:.22; }
  50% { opacity:.42; }
}
@keyframes sduRouteVisible {
  from { opacity:0; }
  to { opacity:.85; }
}
@keyframes sduMarkOn {
  from { opacity:.5; transform:scale(.8) rotate(-10deg); }
  to { opacity:1; transform:scale(1) rotate(0); }
}

/* Enter once; changing a tab replays only its content, not the app shell. */
#rail { animation:sduSoftReveal .6s ease both; }
#panel { animation:sduSoftReveal .5s ease both; }
#mapwrap { animation:sduSoftReveal .7s ease both; }
.mark { overflow:hidden; transition:transform var(--motion-fluid) var(--motion-ease),box-shadow var(--motion-fluid) ease; }
.mark svg { animation:sduMarkOn .7s var(--motion-ease) both; }
.mark:hover { transform:rotate(-5deg) scale(1.05); box-shadow:0 8px 22px rgba(20,33,61,.17); }
.brand { transition:letter-spacing var(--motion-snappy) ease; }
.brand:hover { letter-spacing:.006em; }
.tab { position:relative; transition:background var(--motion-snappy),color var(--motion-snappy),transform var(--motion-snappy) var(--motion-ease); }
.tab:hover { transform:translateY(-2px); }
.tab:active { transform:scale(.96); }
.tab .ico { transition:transform var(--motion-fluid) var(--motion-ease); }
.tab[aria-current="page"] .ico { transform:scale(1.1); }
@media (min-width:900px) {
  .tab[aria-current="page"]::before {
    content:""; position:absolute; left:-6px; top:13px; bottom:13px;
    width:3px; border-radius:4px; background:var(--accent);
    animation:sduFadeRise .28s var(--motion-ease) both;
  }
}

.view:not([hidden]) { animation:sduFadeRise .35s var(--motion-ease) both; }
.view:not([hidden]) > h1,
.view:not([hidden]) > .search,
.view:not([hidden]) > .chips,
.view:not([hidden]) > .rform,
.view:not([hidden]) > #rout,
.view:not([hidden]) > #home,
.view:not([hidden]) > #results,
.view:not([hidden]) > #plist {
  animation:sduFadeRise .44s var(--motion-ease) both;
}
.view:not([hidden]) > .search { animation-delay:40ms; }
.view:not([hidden]) > .chips { animation-delay:80ms; }
.view:not([hidden]) > #home,
.view:not([hidden]) > #plist { animation-delay:100ms; }
.search input { transition:border-color .2s ease,box-shadow .3s ease,transform .3s var(--motion-ease); }
.search input:focus { box-shadow:0 0 0 4px var(--accent-soft),var(--shadow); transform:translateY(-1px); }

/* Reusable micro-interactions and staggered results. */
.chip, .btn, .iconbtn, .swap, .mapctl button, .roomlist button,
.floors .seg button { transition:transform .2s var(--motion-ease),background .2s ease,box-shadow .2s ease,border-color .2s ease,filter .2s ease; }
.chip:hover,.btn:hover,.mapctl button:hover,.roomlist button:hover { transform:translateY(-2px); }
.chip:active,.btn:active,.iconbtn:active,.swap:active,.mapctl button:active { transform:scale(.96); }
.btn.primary:hover { box-shadow:0 6px 15px rgba(23,128,126,.18); }
.card { transition:box-shadow .25s ease,border-color .25s ease; }
.card.next:hover { box-shadow:var(--shadow);border-color:var(--accent); }
.next .tile { transition:transform .35s var(--motion-ease); }
.next:hover .tile { transform:scale(1.04); }
.res { animation:sduFadeRise .38s var(--motion-ease) both; animation-delay:calc(min(var(--item-index,0),7) * 34ms); transition:border-color .2s ease,box-shadow .2s ease,transform .2s var(--motion-ease); }
.res:hover { border-color:var(--accent); box-shadow:0 6px 17px rgba(20,33,61,.07); transform:translateY(-1px); }
.res .res-card { animation:sduFadeRise .24s var(--motion-ease) both; transform-origin:top; }
.list .res:nth-child(1) { --item-index:0; }
.list .res:nth-child(2) { --item-index:1; }
.list .res:nth-child(3) { --item-index:2; }
.list .res:nth-child(4) { --item-index:3; }
.list .res:nth-child(5) { --item-index:4; }
.list .res:nth-child(6) { --item-index:5; }
.list .res:nth-child(7) { --item-index:6; }
.list .res:nth-child(8) { --item-index:7; }
.list .res:nth-child(n+9) { --item-index:8; }

/* The campus-spine metaphor comes alive, only as stations appear. */
.metro li .dot { transform-origin:center; animation:sduStationIn .48s var(--motion-ease) both; animation-delay:calc(var(--station-index,0) * 54ms); }
.metro li .st { animation:sduFadeRise .34s var(--motion-ease) both; animation-delay:calc(var(--station-index,0) * 44ms); }
.metro .dot { transition:box-shadow .2s ease,border-color .2s ease; }
.metro li:hover .dot { box-shadow:0 0 0 5px var(--accent-soft); }
.metro li.end:hover .dot { box-shadow:0 0 0 5px var(--accent-soft); }
.st .chev, .res .chev { transition:transform .24s var(--motion-ease); }
.st:hover .chev { transform:translateX(4px); }

/* SVG map: brief arrival animation, fast hover, and a moving route tracer. */
#mapwrap .campus-spine-line { fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1150;stroke-dashoffset:1150;opacity:0;pointer-events:none; }
#mapwrap.map-opening .campus-spine-line { animation:sduCorridorTrace 1.45s ease-in-out .14s both; }
#mapwrap.map-opening #map .blk { animation:sduMapBlock .68s var(--motion-ease) both; animation-delay:calc(var(--map-index,0) * 65ms); }
#mapwrap.map-opening #map .band { animation:sduSoftReveal .5s ease both; }
.blk .bk { transition:opacity .25s ease,filter .28s ease,stroke-width .2s ease; }
.blk:hover .bk { filter:brightness(1.12) drop-shadow(0 2px 5px rgba(20,33,61,.18)); }
.blk.sel .bk { filter:brightness(1.08) drop-shadow(0 2px 4px rgba(20,33,61,.2)); }
.route-casing { animation:sduRouteGlow 2.4s ease-in-out infinite; }
.route-flow { fill:none;stroke:var(--surface);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:2 18;stroke-dashoffset:0;pointer-events:none;animation:sduRouteVisible .18s 1.08s both,sduFlow 1.7s 1.1s linear infinite; }
.poi circle, .barrel { transition:filter .22s ease,stroke-width .22s ease; }
.poi:hover circle, .barrel:hover { filter:brightness(1.12) drop-shadow(0 2px 4px rgba(20,33,61,.2)); }
.sheet:not([hidden]) { animation:sduSoftReveal .27s var(--motion-ease) both; }
.sheet .sheet-b > * { animation:sduFadeRise .24s var(--motion-ease) both; }
.msg { animation:sduFadeRise .3s var(--motion-ease) both; }
.steps li { animation:sduFadeRise .36s var(--motion-ease) both; animation-delay:calc(min(var(--item-index,0),6) * 50ms); }
.steps li:nth-child(1) { --item-index:0; }
.steps li:nth-child(2) { --item-index:1; }
.steps li:nth-child(3) { --item-index:2; }
.steps li:nth-child(4) { --item-index:3; }
.steps li:nth-child(5) { --item-index:4; }
.steps li:nth-child(6) { --item-index:5; }
.steps li:nth-child(n+7) { --item-index:6; }

/* Respect system accessibility settings, including reduced transitions. */
@media (prefers-reduced-motion: reduce) {
  #rail,#panel,#mapwrap,.view,.view > *, .mark svg,.res,.res .res-card,
  .metro li .dot,.metro li .st,.sheet,.sheet .sheet-b > *,
  .msg,.steps li,#mapwrap.map-opening #map .blk,#mapwrap.map-opening #map .band,
  #mapwrap.map-opening .campus-spine-line,.route-flow,.route-casing {
    animation:none!important;
  }
  .campus-spine-line,.route-flow { display:none!important; }
  .tab,.tab .ico,.chip,.btn,.iconbtn,.swap,.mapctl button,.roomlist button,
  .mark,.search input,.res,.next .tile,.blk .bk,.poi circle,.barrel,
  .st .chev,.res .chev,.sheet { transition:none!important; }
  .tab:hover,.chip:hover,.btn:hover,.res:hover,.mapctl button:hover,
  .search input:focus,.next:hover .tile { transform:none!important; }
}

 s=s.replace(/(^|[^a-zа-яәіңғүұқөһ0-9])([а-яі])-?(\d{1,3})(?=$|\D)/g,(m,p,l,d)=>CYR[l]?p+CYR[l]+d:m);
 s=s.replace(/\b([a-i])\s*-?\s*(\d{1,3})\b/g,'$1$2');
 s=s.replace(/wi[\s-]?fi|вай[\s-]?фай/g,'wifi');
 s=s.replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
 return s;
}
function hay(l){
 if(l._hay)return l._hay;
 const parts=[l.code,l.alt,l.n&&l.n.en,l.n&&l.n.ru,l.n&&l.n.kk,l.kw,TYPEKW[l.type]];
 if(FAC[l.b]&&(l.type==='block'||l.type==='classroom'||l.type==='lecture_hall'))parts.push(FAC[l.b].en,FAC[l.b].ru,FAC[l.b].kk);
 parts.push(TYPEKW.block,l.b.toLowerCase());
 l._hay=[...new Set(norm(parts.filter(Boolean).join(' ')).split(' '))];return l._hay;
}
// Bounded Levenshtein distance is only used for words, never room codes.
function editDistance(a,b,max){
 if(Math.abs(a.length-b.length)>max)return max+1;
 let prev=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
   const next=[i];let rowMin=i;
   for(let j=1;j<=b.length;j++){next[j]=Math.min(next[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));rowMin=Math.min(rowMin,next[j])}
   if(rowMin>max)return max+1;prev=next;
 }
 return prev[b.length];
}
function wordScore(l,w,cache){
 const code=(l.code||'').toLowerCase(),alt=(l.alt||'').toLowerCase();
 if(/^[a-i]\d{0,3}$/.test(w)){
   if(w.length===1)return l.b.toLowerCase()===w?400:0;
   if(code===w||alt===w)return 400;
   if(code.startsWith(w)||alt.startsWith(w))return 300;return 0;
 }
 if(/^\d{2,3}$/.test(w)&&code){const number=code.slice(1);if(number===w)return 400;if(number.startsWith(w))return 300;if(number.includes(w))return 200}
 const H=hay(l);
 const tryW=x=>{if(x.length<2)return 0;if(H.includes(x))return 400;if(H.some(h=>h.startsWith(x)))return 300;if(x.length>=3&&H.some(h=>h.includes(x)))return 200;return 0};
 let s=tryW(w);if(s)return s;
 for(const suf of KKSUF){if(w.length-suf.length>=3&&w.endsWith(suf)&&tryW(w.slice(0,-suf.length)))return 200}
 if(w.length>=5&&/[а-яәіңғүұқөһі]/u.test(w)&&tryW(w.slice(0,-2)))return 200; // Russian endings
 if(w.length<4||w.length>40||!/^\p{L}+$/u.test(w))return 0;
 const max=w.length>=8?2:1;let best=max+1;
 for(const h of H){
   if(h.length<4||Math.abs(h.length-w.length)>max||!/^\p{L}+$/u.test(h))continue;
   const key=w+'\0'+h;let d=cache.get(key);if(d===undefined){d=editDistance(w,h,max);cache.set(key,d)}
   best=Math.min(best,d);if(best===1)break;
 }
 if(best<=max)return 100+(max-best)*10;
 return 0;
}
function search(q,limit){
 limit=limit||10;let n=norm(q);if(!n)return [];
 const bm=n.match(/^(?:block |блок |корпус )?([a-iа-яі])(?: блогы| блок| block)?$/);
 if(bm){const L=CYR[bm[1]]||bm[1];if(BYID['blk-'+L.toUpperCase()])return [BYID['blk-'+L.toUpperCase()]]}
 const toks=n.split(' ').filter(w=>w&&!STOP.has(w));
 if(!toks.length)return [];
 const codes=toks.filter(w=>/^[a-i]\d{2,3}$/.test(w));
 if(codes.length){const ex=LOC.filter(l=>codes.includes((l.code||'').toLowerCase())||codes.includes((l.alt||'').toLowerCase()));if(ex.length)return ex}
 const cache=new Map(),ranked=LOC.map(l=>{
   const scores=toks.map(w=>wordScore(l,w,cache)),matched=scores.filter(Boolean);
   if(!l._searchNames)l._searchNames=[l.code,l.alt,l.n&&l.n.en,l.n&&l.n.ru,l.n&&l.n.kk,`block ${l.b}`,`блок ${l.b}`,`${l.b} блогы`].filter(Boolean).map(norm);
   const identity=l._searchNames.some(x=>x===n)?2:l._searchNames.some(x=>x.startsWith(n))?1:0;
   return {l,matched:matched.length,tier:matched.length?Math.floor(Math.min(...matched)/100):0,identity,total:matched.reduce((a,b)=>a+b,0)+(l.key?6:0)+(l.type==='block'?4:0)};
 });
 let out=ranked.filter(x=>x.matched===toks.length);
 if(!out.length&&toks.length>1)out=ranked.filter(x=>x.matched); // retain the existing any-word fallback
 out.sort((a,b)=>b.matched-a.matched||b.tier-a.tier||b.identity-a.identity||b.total-a.total||String(a.l.code||nameOf(a.l)).localeCompare(String(b.l.code||nameOf(b.l)),undefined,{numeric:true}));
 return out.slice(0,limit).map(x=>x.l);
}
function resolve(text){const r=search(text,1);return r[0]||null}

/* =========================================================
   5. ROUTING — graph over blocks (+ floors). Ready for corridor-level nodes later.
   ========================================================= */
function bfs(a,b){const q=[[a]],seen=new Set([a]);while(q.length){const p=q.shift(),x=p[p.length-1];if(x===b)return p;for(const n of LINKS[x]||[])if(!seen.has(n)){seen.add(n);q.push([...p,n])}}return [a]}
function hops(a,b){return bfs(a,b).length-1}
function route(from,to){
 if(from.id===to.id||(from.type==='block'&&to.type==='block'&&from.b===to.b))return {same:true,from,to};
 const path=bfs(from.b,to.b);const steps=[];
 const sf=from.type==='block'?1:from.f, ef=to.type==='block'?1:to.f;
 steps.push(t('st_start',{p:labelFull(from)}));
 if(from.b!==to.b){
   if(sf>1)steps.push(t('st_down'));
   steps.push(t('st_walk',{path:path.map(blockName).join(' → ')}));
   if(to.b==='I')steps.push(t('st_offmap'));
   if(ef>1)steps.push(t('st_up',{b:blockName(to.b),f:floorTo(ef)}));
 }else if(sf!==ef)steps.push(t('st_same',{b:blockName(to.b),f:floorTo(ef)}));
 if(to.hwing)steps.push(t('st_hwing'));
 if(to.barrel)steps.push(t('st_barrel',{n:t('ord')[to.barrel-1]}));
 if(to.type==='classroom'||to.type==='lecture_hall')steps.push(t('st_follow',{c:to.code}));
 else if(to.type!=='block')steps.push(t('st_place',{p:nameOf(to)}));
 steps.push(t('st_arrive',{p:labelFull(to)}));
 return {path,steps,from,to,sf,ef};
}
function labelFull(l){return l.type==='block'?blockName(l.b):(l.code?(l.type==='lecture_hall'?l.alt+' / '+l.code:l.code):nameOf(l))+' ('+blockName(l.b)+', '+floorName(l.f)+')'}

function validCachedRoute(r){

 if(!Object.prototype.hasOwnProperty.call(BYID,r.from)||!Object.prototype.hasOwnProperty.call(BYID,r.to))return false;
 if(!['en','ru','kk'].includes(r.lang)||!Array.isArray(r.steps)||!r.steps.length||r.steps.length>50||!r.steps.every(s=>typeof s==='string'&&s.length>0&&s.length<=2000))return false;

 return Number.isInteger(r.sf)&&r.sf>0&&r.sf<=10&&Number.isInteger(r.ef)&&r.ef>0&&r.ef<=10&&Number.isSafeInteger(r.generatedAt)&&r.generatedAt>=0&&Number.isSafeInteger(r.viewedAt)&&r.viewedAt>=0;

function readCachedRoutes(value){

/* The bundled file works directly; hosted copies need a previously cached shell. */
const offline={state:'preparing'};
function renderOfflineStatus(){
 const key={file:'offline_file',preparing:'offline_preparing',ready:'offline_ready',unavailable:'offline_unavailable',conflict:'offline_conflict',error:'offline_error'}[offline.state];
 $('#offline-status').innerHTML=`${ico('info')}<span>${esc(t(key))}${navigator.onLine===false?' '+esc(t('offline_disconnected')):''}</span>`;
}
function setupOffline(){
 if(location.protocol==='file:'){offline.state='file';renderOfflineStatus();return}
 if(!window.isSecureContext||!navigator.serviceWorker||typeof navigator.serviceWorker.getRegistration!=='function'||!('caches' in window)){offline.state='unavailable';renderOfflineStatus();return}
 const appURL=new URL(location.href);appURL.search='';appURL.hash='';
 const workerURL=new URL('sdunav-sw.js',appURL);workerURL.searchParams.set('app',appURL.pathname);
 const scopeURL=new URL('.',workerURL).href,cacheName='sdunav-shell:'+encodeURIComponent(appURL.pathname)+':v1';
 const hasCopy=()=>caches.open(cacheName).then(cache=>cache.match(appURL.href)).then(Boolean);
 const activated=registration=>{
   if(registration.active&&registration.active.state==='activated')return Promise.resolve();
   const worker=registration.installing||registration.waiting||registration.active;
   if(!worker)return Promise.reject(new Error('No service worker'));
   return new Promise((resolve,reject)=>{
     const changed=()=>{if(worker.state==='activated'){worker.removeEventListener('statechange',changed);resolve()}else if(worker.state==='redundant'){worker.removeEventListener('statechange',changed);reject(new Error('Service worker failed'))}};
     worker.addEventListener('statechange',changed);changed();
   });
 };
 let existingCopy=false;
 navigator.serviceWorker.getRegistration(appURL.href).then(registration=>{
   const sameScope=registration&&registration.scope===scopeURL;
   const workers=sameScope?[registration.active,registration.waiting,registration.installing].filter(Boolean):[];
   if(workers.some(worker=>worker.scriptURL!==workerURL.href)){offline.state='conflict';renderOfflineStatus();return null}
   const existing=sameScope&&registration.active&&registration.active.state==='activated';
   return (existing?hasCopy():Promise.resolve(false)).then(found=>{
     existingCopy=found;
     if(found){offline.state='ready';renderOfflineStatus()}
     if(found&&navigator.onLine===false)return null;
     return navigator.serviceWorker.register(workerURL.href).then(activated).then(hasCopy).then(ready=>{offline.state=ready?'ready':'error';renderOfflineStatus()});
   });
 }).catch(()=>{offline.state=existingCopy?'ready':'error';renderOfflineStatus()});
}

function speechEngine(){try{return typeof window.SpeechSynthesisUtterance==='function'&&window.speechSynthesis&&typeof window.speechSynthesis.speak==='function'?window.speechSynthesis:null}catch(e){return null}}
const speech={engine:speechEngine(),state:'idle',utterance:null,serial:0,routeKey:null,error:null,quietUntil:0};

 let voices=[];try{voices=typeof speech.engine.getVoices==='function'?speech.engine.getVoices()||[]:[]}catch(e){}
 const lang=SPEECH_LANG[S.lang]||SPEECH_LANG.en,base=lang.toLowerCase().split('-')[0];
 const matches=voices.filter(v=>String(v.lang||'').toLowerCase().replace('_','-').split('-')[0]===base&&v.localService!==false);
 matches.sort((a,b)=>{
   const score=v=>(v.localService===true?4:0)+(String(v.lang||'').toLowerCase().replace('_','-')===lang.toLowerCase()?2:0)+(v.default?1:0);
   return score(b)-score(a);

}

function syncSpeechControls(){

 $$('.speech-controls').forEach(group=>{
   const play=group.querySelector('[data-act="speech-play"]'),pause=group.querySelector('[data-act="speech-pause"]'),stop=group.querySelector('[data-act="speech-stop"]'),message=group.querySelector('.speech-status');

}
function stopSpeech(){

 if(active&&speech.engine)try{speech.quietUntil=Date.now()+250;speech.engine.cancel();if(wasPaused&&typeof speech.engine.resume==='function')speech.engine.resume()}catch(e){}

function playSpeech(){

   if(active){speech.quietUntil=Date.now()+250;speech.engine.cancel()}if(wasPaused&&typeof speech.engine.resume==='function')speech.engine.resume();

   u.onend=()=>{if(serial!==speech.serial)return;const neverStarted=speech.state==='starting';speech.utterance=null;speech.state='idle';speech.error=neverStarted?'speech_error':null;syncSpeechControls()};

 s+=`<g opacity=".8"><circle cx="342" cy="825" r="22" fill="none" stroke="#5A55C9" stroke-width="3"/><circle cx="342" cy="825" r="15" fill="none" stroke="#5A55C9" stroke-width="3"/></g>`;
 // badges + side labels

 for(const b of ['H','G','F','E','D'])s+=lbl(b,(BANDS[b][0]+BANDS[b][1])/2);
 const badge=(b,x,y)=>`<g class="badge" style="--c:${col(b)}" data-act="block" data-b="${b}"><circle cx="${x}" cy="${y}" r="12"/><text x="${x}" y="${y+.5}">${b}</text></g>`;
 s+=badge('C',448,792)+badge('A',126,770)+badge('B',212,950)+badge('I',316,-2);
 // WC markers from the map (decorative, not in dataset)
 [[289,203],[289,300],[289,345],[289,437],[289,488],[289,580],[289,628],[289,722]].forEach(([x,y])=>{s+=`<text class="wc" x="${x}" y="${y}">WC</text>`});
 // POIs with verified map positions
 for(const l of LOC){if(!l.pos||l.type==='lecture_hall')continue;const[x,y]=l.pos;
   const c=l.cat==='health'?'var(--pink)':l.cat==='study'&&l.type==='library'?'var(--lib)':l.type==='venue'?'var(--bA)':l.type==='sport'?'var(--barrel)':'var(--bC)';

/* pan / zoom */
let anim=0;
function animateTo(t2){
 cancelAnimationFrame(anim);const from={...vb},dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:420,t0=performance.now();
 const step=now=>{const k=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-k,3);for(const p of ['x','y','w','h'])vb[p]=from[p]+(t2[p]-from[p])*e;setVB();if(k<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step);
}
function sheetOffset(h){const sh=$('#sheet');if(!isPhone()||sh.hidden)return 0;return sh.classList.contains('collapsed')?h*.06:h*.22}
function focusAt(x,y,w){const h=w*VB0.h/VB0.w;const sheetOff=sheetOffset(h);animateTo({x:x-w/2,y:y-h/2+sheetOff,w,h})}
function fitPts(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});
 const r=svg.getBoundingClientRect();const asp=r.width&&r.height?r.width/r.height:VB0.w/VB0.h;
 let w=Math.max(x1-x0+140,340),h=Math.max(y1-y0+160,420);if(w/h<asp)w=h*asp;else h=w/asp;
 const off=sheetOffset(h);animateTo({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2+off,w,h})}
function zoom(f,cx,cy){const nw=Math.min(1400,Math.max(110,vb.w*f));const k=nw/vb.w;if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2}
 vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k};setVB()}
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoom(Math.exp(e.deltaY*0.0015),p.x,p.y)},{passive:false});
const ptrs=new Map();let moved=0,pinch0=null;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),w:vb.w}}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const m=svg.getScreenCTM();if(!m)return;
 if(ptrs.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){svg.classList.add('drag');if(!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId)}vb.x-=dx/m.a;vb.y-=dy/m.d;setVB()}
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch0){moved=99;const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const c=toSvg({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2});zoom((pinch0.w*pinch0.d/d)/vb.w,c.x,c.y)}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;svg.classList.remove('drag')};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault()}},true);

const AssistantProvider={answer:raw=>ruleAnswer(raw)};
function miniTitle(l){return l.code?(l.type==='lecture_hall'?l.alt+' · '+l.code:l.code):nameOf(l)}
function placeSnapshot(l,extra){return {id:l.id,title:miniTitle(l),detail:extra||whereOf(l)}}
function miniHTML(l,extra,title){return `<div class="mini">${tileHTML(l)}<span class="res-main"><b>${esc(title===undefined?miniTitle(l):title)}</b><small>${esc(extra===undefined?whereOf(l):extra)}</small></span><span class="acts"><button class="btn sm" data-act="map" data-id="${esc(l.id)}" aria-label="${esc(t('show_map'))}">${ico('map')}</button><button class="btn sm primary" data-act="route" data-id="${esc(l.id)}" aria-label="${esc(t('route_here'))}">${ico('route')}</button></span></div>`}
function catOf(q){
 if(/(^|\s)(food|eat|eating|hungry|lunch|canteen|cafeteria|meal|snack|ед[ауы]|поесть|покушать|перекус|обед|столов\S*|асхана\S*|тамақ\S*)($|\s)|голод/.test(q))return 'food';
 if(/coffee|кофе|(^|\s)(cafe|кафе)($|\s)/.test(q))return 'coffee';
 if(/study|library|wifi|quiet|(^|\s)read|учиться|учёб|учеб|позаним|заним|библиотек|почитать|оқу|оқитын|кітапхана/.test(q))return 'study';
 if(/doctor|medical|sick|health|nurse|врач|медпункт|медицин|болит|заболел|дәрігер|ауыр|медбике/.test(q))return 'health';
 if(/shop|market|buy|store|магазин|маркет|купить|дүкен|сатып/.test(q))return 'shop';
 if(/sport|tennis|спорт|теннис/.test(q))return 'sport';
 return null;
}
const CATMATCH={coffee:l=>l.type==='cafe',food:l=>l.type==='canteen'||l.type==='cafe',study:l=>l.id==='b-lib'||l.id==='c-wifi',health:l=>l.cat==='health',shop:l=>l.type==='shop',sport:l=>l.cat==='sport'};
function rank(from,cat){return LOC.filter(CATMATCH[cat]).map(l=>({l,h:hops(from.b,l.b),fl:from.b===l.b?Math.abs((from.f||1)-l.f):Math.abs((from.f||1)-1)+Math.abs(l.f-1)})).sort((a,b)=>a.h-b.h||a.fl-b.fl||(b.l.key||0)-(a.l.key||0))}
function hopsLabel(h){return h===0?t('hops0'):h===1?t('hops1'):t('hopsn',{n:h})}
function resolveLoose(s){s=s.replace(/^(the|a)\s+/i,'').replace(/[?.!]+$/,'').trim();return resolve(s)}
function ruleAnswer(raw){
 const q=norm(raw);if(!q)return null;
 if(/^(hi|hello|hey|help|привет|здравствуй|здравствуйте|помощь|помоги|сәлем|салем|сәлеметсіз бе|көмек)( |$)/.test(q))return {text:t('bot_hello')};
 if(/print|печат|принтер|басып шығар/.test(q))return {text:t('bot_print')};
 // explicit "from A to B"
 let m=raw.match(/from\s+(.+?)\s+to\s+(.+?)[?.!]*$/i)||raw.match(/(?:^|\s)из\s+(.+?)\s+(?:в|во|до|к|на)\s+(.+?)[?.!]*$/i)||raw.match(/^(.+?)\s*(?:→|->)\s*(.+?)[?.!]*$/)
   ||raw.match(/^(\S+?)[\s-]*(?:дан|ден|тан|тен|нан|нен)\s+(.+?)(?:\s+(?:қалай|дейін|бару|жету).*)?[?.!]*$/i);
 if(m){const a=resolveLoose(m[1]),b=resolveLoose(m[2]);if(a&&b)return routeAnswer(a,b,false)}
 // "how do I get to X"
 m=raw.match(/(?:how (?:do i|can i|to)?\s*(?:get|go) to|directions to|route to|way to|take me to|navigate to|go to)\s+(.+?)[?.!]*$/i)
   ||raw.match(/(?:как\s+(?:мне\s+)?(?:пройти|дойти|добраться|попасть)|маршрут|дорога|проведи)\s+(?:до|в|во|к|на)?\s*(.+?)[?.!]*$/i)
   ||raw.match(/^(.+?)\s+(?:қалай\s+(?:барамын|баруға|барам|жетемін|барады)|бару жолы|дейін жол).*$/i);
 if(m){const b=resolveLoose(m[1]);if(b){const a=S.here&&BYID[S.here]&&S.here!==b.id?BYID[S.here]:BYID['c-entrance'];return routeAnswer(a,b,a.id==='c-entrance')}}
 const cat=catOf(q);
 if(cat){
   let lm=raw.match(/\b(?:near|at|around|close to)\s+(.+?)[?.!]*$/i)||raw.match(/(?:рядом с|возле|около|недалеко от|у)\s+(.+?)[?.!]*$/i)||raw.match(/^(.+?)[\s-]*(?:жанында|маңында|қасында|жанындағы|маңындағы)/i);
   let at=lm?resolveLoose(lm[1]):null;
   if(at&&CATMATCH[cat](at))at=null;
   if(!at&&S.here&&BYID[S.here])at=BYID[S.here];
   if(at){S.here=at.id;const r=rank(at,cat).slice(0,4);return {text:t('bot_near',{p:shortName(at)}),content:{kind:'places',items:r.map(x=>placeSnapshot(x.l,whereOf(x.l)+' · '+hopsLabel(x.h)))}}}
   const all=LOC.filter(CATMATCH[cat]).slice(0,6);return {text:t('bot_near_all'),content:{kind:'places',items:all.map(l=>placeSnapshot(l))}};
 }
 const r=search(raw,4);
 if(r.length)return {text:r.length===1?t('bot_one'):t('bot_found'),content:{kind:'places',items:r.map(l=>placeSnapshot(l))}};
 return {text:t('bot_none')};
}
function routeAnswer(a,b,fromEntrance){
 const R=route(a,b);S.here=a.id;
 if(R.same)return {text:t('same')};
 rememberRoute(R,null);
 return {text:t('bot_route',{a:shortName(a),b:shortName(b)}),content:{kind:'route',from:a.id,to:b.id,path:R.path.slice(),steps:R.steps.slice(),ef:R.ef,target:b.code||nameOf(b),isBlock:b.type==='block',entranceNote:fromEntrance?t('bot_from_entrance'):''}};
}

const CHAT_HISTORY_KEY='sdunav.chatHistory.v1';
function validChatTurn(turn){return !!turn&&typeof turn==='object'&&typeof turn.id==='string'&&turn.id.length>0&&Number.isSafeInteger(turn.createdAt)&&turn.createdAt>=0&&typeof turn.question==='string'&&typeof turn.answer==='string'}
function chatTurns(value){
 if(!Array.isArray(value))return [];
 const seen=new Set();return value.filter(turn=>{if(!validChatTurn(turn)||seen.has(turn.id))return false;seen.add(turn.id);return true});
}
function storedChatHistory(){

}

 }).join('');

function saveChatHistory(){
 try{
   const stored=storedChatHistory(),ids=new Set(stored.filter(x=>x&&typeof x.id==='string').map(x=>x.id));
   const merged=stored.concat(S.chatHistory.filter(turn=>!ids.has(turn.id))),next=chatTurns(merged);
   const changed=S.chatHistory.map(turn=>turn.id).join('\u0000')!==next.map(turn=>turn.id).join('\u0000');

function ask(text){
 text=text.trim();if(!text)return;
 let a;try{a=AssistantProvider.answer(text)}catch(e){a=null}if(!a||typeof a.text!=='string')a={text:t('bot_none')};
 const now=Date.now(),turn={id:now.toString(36)+'-'+Math.random().toString(36).slice(2),createdAt:now,question:text,answer:a.text,content:validChatContent(a.content)?a.content:null};
 S.chatHistory.push(turn);$('#askex').hidden=true;appendChatTurn(turn,true);
 if(saveChatHistory())renderChatHistory(true);else renderChatStatus();
}
function renderAskEx(){$('#askex').innerHTML=t('ex').map(x=>`<button class="chip" data-act="askex">${esc(x)}</button>`).join('');renderChatHistory(false)}
$('#askform').addEventListener('submit',e=>{e.preventDefault();const i=$('#askq');ask(i.value);i.value='';i.focus()});

/* =========================================================
   11. NAVIGATION + EVENTS
   ========================================================= */
function setView(v,keepSpeech){
 if(v!=='route'&&!keepSpeech)stopSpeech();
 if(v!=='search')closeSearchSuggestions();
 S.view=v;if(v!=='route')S.tab=v;
 document.body.dataset.tab=v;
 ['search','map','places','favorites','ask','route'].forEach(x=>{const el=$('#v-'+x);if(x==='map'){el.hidden=!(v==='map')}else el.hidden=x!==v});
 $$('.tab').forEach(b=>{if(b.dataset.tab===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('#panel').scrollTop=0;
 if(v==='map'&&isPhone())requestAnimationFrame(()=>setVB());
}
function showOnMap(id){
 const l=BYID[id];if(!l)return;stopSpeech();S.sel=l.type==='block'?null:id;S.selBlock=l.type==='block'?l.b:null;S.showRoute=false;
 if(l.type!=='block'&&l.f!==S.floor)S.floor=l.f<=3?l.f:1;
 addRecent(id);if(isPhone())setView('map');
 if(l.type==='block')openSheet({kind:'block',b:l.b});else openSheet({kind:'place',id});
 drawMap();const p=ptOf(l);if(p)requestAnimationFrame(()=>focusAt(p[0],p[1],l.type==='block'?300:240));
}
function selectBlock(b){stopSpeech();S.selBlock=b;S.sel=null;S.showRoute=false;if(isPhone())setView('map');openSheet({kind:'block',b});drawMap();const p=b==='I'?[316,60]:ANCH[b];requestAnimationFrame(()=>focusAt(p[0],p[1]+(['D','E','F','G','H'].includes(b)?0:20),320))}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
 switch(act){
 case 'tab':setView(a.dataset.tab);if(a.dataset.tab==='search')setTimeout(()=>{if(!isPhone())$('#q').focus()},0);if(a.dataset.tab==='ask')setTimeout(()=>$('#thread').lastElementChild&&$('#thread').lastElementChild.scrollIntoView({block:'end'}),0);break;
 case 'lang':{
   if(S.lang!==a.dataset.lang){stopSpeech();S.lang=a.dataset.lang;if(S.routeRes){const f=BYID[S.route.from],to=BYID[S.route.to];S.routeRes=f&&to?route(f,to):null;setSpeechRoute(S.routeRes)}}
   store.set('lang',S.lang);renderAll();break;
 }
 case 'theme':{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('theme',nx);themeIcon();break}
 case 'favorite':{
   if(!Object.prototype.hasOwnProperty.call(BYID,id))break;
   const favoriteIndex=[...$('#favorites').querySelectorAll('.fav-btn')].indexOf(a);
   S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];
   S.favStorageError=!store.set('favorites',S.favorites);syncFavoriteButtons();renderFavorites();
   if(favoriteIndex>=0){const buttons=[...$('#favorites').querySelectorAll('.fav-btn')];(buttons[Math.min(favoriteIndex,buttons.length-1)]||$('#favorites [data-tab="search"]')).focus()}
   break;
 }
 case 'qclear':$('#q').value='';closeSearchSuggestions();renderResults();$('#q').focus();break;
 case 'setq':$('#q').value=a.dataset.q;renderResults();break;
 case 'quick':{const tg=a.dataset.target;if(tg.startsWith('q:')){$('#q').value=tg==='q:canteen'?(S.lang==='ru'?'столовая':S.lang==='kk'?'асхана':'canteen'):(S.lang==='en'?'coffee':'кофе');setView('search');renderResults()}else{lastExpanded=tg;showOnMap(tg);if(!isPhone()){$('#q').value=BYID[tg].n[S.lang];renderResults()}}break}
 case 'toggle':{if(BYID[id].type==='block'){selectBlock(BYID[id].b);break}const open=a.getAttribute('aria-expanded')==='true';lastExpanded=open?null:id;const li=a.closest('.res');if(open){li.querySelector('.res-card')&&li.querySelector('.res-card').remove();a.setAttribute('aria-expanded','false')}else{const d=document.createElement('div');d.className='res-card';d.innerHTML=cardHTML(BYID[id]);li.appendChild(d);a.setAttribute('aria-expanded','true');addRecent(id);if(!isPhone()){S.sel=BYID[id].type==='block'?null:id;S.selBlock=BYID[id].type==='block'?BYID[id].b:null;S.showRoute=false;if(BYID[id].f&&BYID[id].type!=='block')S.floor=BYID[id].f;if(a.closest('#favorites'))openSheet({kind:'place',id});drawMap();const p=ptOf(BYID[id]);if(p)focusAt(p[0],p[1],300)}}break}
 case 'open':showOnMap(id);break;
 case 'map':showOnMap(id);break;
 case 'poi':showOnMap(id);break;
 case 'barrel':{const n=+a.dataset.n;const l=LOC.find(x=>x.barrel===n&&x.f===(S.floor===1?1:2));showOnMap(l.id);break}
 case 'block':selectBlock(a.dataset.b);break;
 case 'route':addRecent(id);openRoute({to:id});break;
 case 'speech-play':playSpeech();break;
 case 'speech-pause':pauseSpeech();break;
 case 'speech-stop':stopSpeech();break;
 case 'from':openRoute({from:id});break;
 case 'openroute':S.route={from:a.dataset.from,to:a.dataset.to};openRoute({});break;
 case 'cached-route':{const saved=S.cachedRoutes[Number(a.dataset.index)];if(saved&&validCachedRoute(saved)){S.route={from:saved.from,to:saved.to};openRoute({cached:saved})}break}
 case 'routemap':showRouteOnMap(true);break;
 case 'route-back':S.showRoute=false;sheetMode=null;renderSheet();drawMap();setView(S.prevTab||'search');break;
 case 'swap':{const x=S.route.from;S.route.from=S.route.to;S.route.to=x;$('#rf').value='';$('#rt').value='';renderRoute();drawMap();if(!isPhone())showRouteOnMap(false);break}
 case 'floor':S.floor=+a.dataset.f;drawMap();renderSheet();break;
 case 'sheet-toggle':sheetCollapsed(!$('#sheet').classList.contains('collapsed'));break;
 case 'zin':zoom(1/1.35);break;case 'zout':zoom(1.35);break;case 'zfit':animateTo({...VB0});break;
 case 'sheet-close':if(sheetMode&&sheetMode.kind==='route')stopSpeech();sheetMode=null;S.selBlock=null;S.sel=null;S.showRoute=false;renderSheet();drawMap();break;
 case 'recent-clear':S.recent=[];store.set('recent',[]);renderRecent();break;
 case 'cat':S.cat=a.dataset.cat;renderCats();renderPlaces();break;
 case 'askex':ask(a.textContent);break;
 case 'blocksearch':setView('search');$('#q').value=a.dataset.b+(S.floor||1);lastExpanded=null;renderResults();$('#q').focus();break;
 }
});
$('#q').addEventListener('input',()=>{lastExpanded=null;const results=renderResults();if($('#q').value.trim())showSearchSuggestions(results);else closeSearchSuggestions()});
$('#q').addEventListener('focus',()=>{if($('#q').value.trim()&&!qSuggest.open)showSearchSuggestions(search($('#q').value,12))});
$('#q').addEventListener('blur',()=>setTimeout(()=>{if(!document.querySelector('.search').contains(document.activeElement))closeSearchSuggestions()},120));
$('#q').addEventListener('keydown',e=>{
 if(e.isComposing)return;
 if(e.key==='Escape'&&qSuggest.open){e.preventDefault();closeSearchSuggestions();return}
 if((e.key==='ArrowDown'||e.key==='ArrowUp')&&$('#q').value.trim()){
   e.preventDefault();if(!qSuggest.open)showSearchSuggestions(search($('#q').value,12));
   if(qSuggest.items.length){qSuggest.index=e.key==='ArrowDown'?(qSuggest.index+1)%qSuggest.items.length:(qSuggest.index<0?qSuggest.items.length-1:(qSuggest.index-1+qSuggest.items.length)%qSuggest.items.length);updateSuggestionSelection()}return;
 }
 if(e.key==='Enter'){
   if(qSuggest.open&&qSuggest.items.length){e.preventDefault();chooseSearchSuggestion(qSuggest.items[qSuggest.index<0?0:qSuggest.index]);return}
   const f=$('#results .res-row');if(f&&f.getAttribute('aria-expanded')!=='true')f.click();
 }
});
$('#q-suggestions').addEventListener('mousedown',e=>e.preventDefault());
$('#q-suggestions').addEventListener('click',e=>{const option=e.target.closest('[role="option"]');if(option)chooseSearchSuggestion(qSuggest.items[+option.dataset.index])});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))closeSearchSuggestions()});
$('#pf').addEventListener('input',renderPlaces);
function themeIcon(){const dark=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';$('#themebtn use').setAttribute('href',dark?'#i-sun':'#i-moon')}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeIcon);
window.addEventListener('resize',()=>{if(!isPhone()&&$('#sheet').classList.contains('collapsed'))sheetCollapsed(false);setVB()});
window.addEventListener('pagehide',stopSpeech);
window.addEventListener('online',()=>{renderOfflineStatus();if(offline.state==='error')setupOffline()});window.addEventListener('offline',renderOfflineStatus);
window.addEventListener('storage',e=>{
 if(e.key==='sdunav.favorites'||e.key===null){S.favorites=favoriteIds(store.get('favorites',[]));S.favStorageError=false;syncFavoriteButtons();renderFavorites()}
 if(e.key==='sdunav.'+ROUTE_CACHE_KEY||e.key===null){S.cachedRoutes=readCachedRoutes(store.get(ROUTE_CACHE_KEY,[]));S.routeStorageError=false;renderCachedRoutes()}
 if((e.key===CHAT_HISTORY_KEY||e.key===null)&&!S.chatStorageError){
   try{S.chatHistory=chatTurns(storedChatHistory());renderChatHistory(false)}catch(err){S.chatStorageError=true;renderChatStatus()}
 }
});

/* boot */
const nl=(navigator.language||'en').toLowerCase();
S.lang=store.get('lang',nl.startsWith('kk')?'kk':nl.startsWith('ru')?'ru':'en');
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
S.recent=store.get('recent',[]);
S.favorites=favoriteIds(store.get('favorites',[]));
S.cachedRoutes=readCachedRoutes(store.get(ROUTE_CACHE_KEY,[]));
try{S.chatHistory=chatTurns(storedChatHistory())}catch(e){S.chatStorageError=true}
themeIcon();setView('search');renderAll();setupOffline();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)$('#mapwrap').classList.remove('map-opening');
else setTimeout(()=>$('#mapwrap').classList.remove('map-opening'),1750);
})();
</script>
